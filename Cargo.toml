[package]
name = "polycubes"
version = "0.1.0"
edition = "2021"

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
format_num = "0.1.0"
itertools = "0.15.0"
lazy_static = "1.4.0"
log = "0.4.20"
nalgebra = "0.35.0"
ndarray = "0.17.0"
num = "0.4.3"
pretty_env_logger = "0.5.0"
rand = "0.10.0"
rayon = "1.10.0"
